<body>

<h1>アルファベット大文字変換</h1>

<p>
入力したアルファベットをすべて大文字に変換します。Twitterやdiscordの海外勢がたまにやってる全部大文字の英語が再現出来ます。
</p>

<input type="text" id="text">

<br><br>

<button onclick="convert()">変換</button>

<script>
function convert() {
    const input = document.getElementById("text");
    input.value = input.value.toUpperCase();
}
</script>
